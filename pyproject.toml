[build-system]
# >=1.27 for PEP 639: the SPDX `license` expression and `license-files` below
# need Metadata 2.4, which older hatchling does not emit. Without the floor a
# constrained build environment produces wrong license metadata rather than
# failing.
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# A shallow checkout has no tags, and the test and docs jobs install the package
# without needing a truthful version. Without a fallback hatch-vcs would fail the
# install outright there; the publish workflow fetches full history, so a release
# never sees this value.
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[project]
name = "lcs_parcels"
# Derived from the git tag by hatch-vcs, so the tag is the only place a version
# is written. A build off a tag is that version; a build between tags carries a
# `.devN+g<sha>` suffix naming the commit.
dynamic = ["version"]
description = "Lagrangian coherent structures with Parcels."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Names only. PEP 621 sends entries with an email to `Author-email` and entries
# without to `Author`, and PyPI then labels the `Author` line with the *other*
# entry's address. Both names in one field keep the attribution right; the
# address goes on `maintainers`, which has its own line.
authors = [
    { name = "Henry Owusu Adjei" },
    { name = "Willi Rath" },
]
maintainers = [{ name = "Willi Rath", email = "wrath@geomar.de" }]
keywords = [
    "lagrangian",
    "coherent-structures",
    "lcs",
    "ftle",
    "oceanography",
    "parcels",
    "xarray",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Physics",
]
# Floors only, no caps: a cap in a library's metadata propagates into every
# downstream resolution. Each floor is the SPEC 0 line
# (https://scientific-python.org/specs/spec-0000/): the oldest minor released
# inside the 24-month window, which opened 2024-08-05 when these were set.
# numpy 2.1.0 is 2024-08-18 and inside it; scipy 1.14.0 is 2024-06-24 and
# outside, so 1.15 is its oldest in-window minor; xarray 2024.7.0 is 2024-07-30
# and outside, so 2024.9 is. The suite passes at all three floors. None sits
# above the line -- a floor may only do that with a measured failure recorded
# beside it, and there is none. `pixi.lock` pins the development environment;
# this declares what the library can live with.
dependencies = ["numpy>=2.1", "xarray>=2024.9", "scipy>=1.15"]

[project.urls]
Homepage = "https://github.com/geomar-od-lagrange/lcs_parcels"
Documentation = "https://lcs-parcels.readthedocs.io/en/latest/"
Repository = "https://github.com/geomar-od-lagrange/lcs_parcels"
Issues = "https://github.com/geomar-od-lagrange/lcs_parcels/issues"
Changelog = "https://github.com/geomar-od-lagrange/lcs_parcels/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lcs_parcels"]

# The sdist is the package, not the working repository: agent instructions, the
# plans, the development lockfile and CI config have no use once installed. The
# `.ipynb` go too -- their value is that they render on the forge, which an sdist
# does not, and the executed outputs were 85% of a 1 MB archive. The `.py`
# sources they are generated from stay, so `tests/test_examples.py` still has
# something to execute. (Hatchling includes `.gitignore` whatever this says; it
# is one line and not worth fighting the backend over.)
[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".github",
    ".gitattributes",
    ".gitignore",
    "AGENTS.md",
    "CLAUDE.md",
    "pixi.lock",
    "plans",
    "*.ipynb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# One line per test, so a run in progress shows which test it is on and a failure
# names it in place; `-ra` spells out every skip and failure at the end.
addopts = "-v -ra"
markers = [
  "minimal: needs neither CMEMS credentials nor downloaded data",
  "needs_creds: needs CMEMS credentials, and downloads data if it is absent",
]

[tool.coverage.run]
branch = true
source = ["lcs_parcels"]

[tool.coverage.report]
# The three abstract-method bodies are `raise NotImplementedError` and are never
# executed by design. Excluding them makes 100% the honest number to gate on.
exclude_also = ["raise NotImplementedError"]

[tool.ruff]
# Notebooks and prose are generated or vendored: the `.ipynb`/`.md` of an
# example come from its `.py`, which is what gets linted; `.claude` is vendored
# agent skills.
extend-exclude = ["*.ipynb", "*.md", ".claude"]

[tool.ruff.lint]
extend-select = [
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "NPY", # numpy-specific rules
    "RUF",
]
# Prose in comments and docstrings uses en dashes and other typographic unicode
# on purpose; only math glyphs are banned, and that is a review rule, not a lint.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Jupytext py:percent sources: cell-level imports and expression statements
# (a bare `ds` to display it) are the notebook idiom, not a defect.
"examples/*.py" = ["E402", "B018"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
lcs_parcels = { path = ".", editable = true }

[tool.pixi.tasks]
lint = "ruff check . && ruff format --check ."
test = { cmd = 'pytest -m "not needs_creds"', description = "Unit suite plus the examples that need no credentials" }
test-cov = { cmd = 'pytest -m "not needs_creds" --cov --cov-branch --cov-report=term-missing --cov-fail-under=100', description = "Unit suite with branch coverage, gated at 100%" }

[tool.pixi.dependencies]
pytest = ">=9.0.3,<10"
numpy = "*"
xarray = "*"
ipython = ">=9.14.1,<10"
ipykernel = ">=7.3.0,<8"
nbconvert = ">=7.17.1,<8"
jupytext = ">=1.19.4,<2"
python = ">=3.12"
scipy = ">=1.18.0,<2"
ruff = ">=0.16.1,<0.17"
pytest-cov = ">=7.1.0,<8"

# --- examples feature -------------------------------------------------------
# Real Parcels-driven examples (CMEMS currents, advection). The default env is
# kept minimal; this feature adds the heavy Parcels + CMEMS stack. Both envs pin
# Python 3.13 (the newest Parcels v4 supports). Parcels' binary dependency stack
# comes from conda-forge (so uv finds it already satisfied); Parcels itself is
# pinned to a v4 `main` SHA.
[tool.pixi.feature.examples.dependencies]
python = "3.13.*"
# Parcels v4 runtime stack (see OceanParcels/Parcels pyproject at the pinned SHA).
cftime = ">=1.6.3"
numpy = ">=2.1.0"
dask = ">=2024.5.1"
netcdf4 = ">=1.7.2"
zarr = ">=3"
tqdm = ">=4.50.0"
pandas = ">=2.2"
pyarrow = ">=20.0.0"
uxarray = ">=2026.04.1"
pooch = ">=1.8.0"
xgcm = ">=0.9.0"
cf_xarray = ">=0.8.6"
polars = ">=1.31.0"
# CMEMS access + plotting for the example itself.
copernicusmarine = ">=2"
matplotlib-base = "*"
# Without it, `copernicusmarine`'s tqdm prints an IProgress warning carrying the
# absolute path of the environment it ran in, which lands in the committed output.
ipywidgets = ">=8.1.8,<9"

[tool.pixi.feature.examples.pypi-dependencies]
# Pinned to Parcels v4 `main` (HEAD as of 2026-07-10). Bump the rev to advance.
parcels = { git = "https://github.com/OceanParcels/Parcels.git", rev = "5a0df965fe70f37add860230cbcd3b2fc03ffd2e" }

[tool.pixi.feature.examples.tasks]
test-examples = { cmd = "pytest tests/test_examples.py", description = "Every example, including the one needing no credentials" }
get-data = { cmd = "python get_data.py", cwd = "examples", description = "Download the CMEMS subset to examples/data/ (needs CMEMS credentials)" }

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
myst-parser = ">=5.1.0,<6"
myst-nb = ">=1.4.0,<2"
sphinx-autobuild = ">=2025.8.25,<2026"

[tool.pixi.feature.docs.tasks]
docs-serve = { cmd = "sphinx-autobuild docs docs/_build/html", description = "Serve the documentation site with live reload" }
docs-build = { cmd = "sphinx-build -b html -W --keep-going docs docs/_build/html", description = "Build the documentation site; warnings are failures" }

# Every environment also gets the default feature, which carries the package and
# the test tooling; the `pyNNN` features add nothing but an interpreter pin.
# `default` is 3.13, so it agrees with `examples` (the newest Parcels v4
# supports). `py312` and `py314` are the ends of the supported range and are what
# the CI matrix runs.
[tool.pixi.environments]
default = ["py313"]
examples = { features = ["examples"] }
py312 = ["py312"]
py314 = ["py314"]
docs = ["docs"]
