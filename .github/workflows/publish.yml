name: Publish

# Tag-driven. Pushing `vYYYY.M.D.N` publishes that commit; nothing else does.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # A tag that disagrees with the packaged version would publish under a
      # name nobody asked for, and PyPI takes a version exactly once. `uv build`
      # writes the version into the filenames, so compare against those: it is
      # what actually ships, PEP 440 normalisation included.
      - name: Build and check that the tag matches the version
        run: |
          uv build
          version=$(uv run --no-project python -c \
            "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag packaged=$version"
          test "$tag" = "$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match [project] version $version"
            exit 1
          }
          test -f "dist/lcs_parcels-${version}.tar.gz" || {
            echo "::error::no sdist for $version; PEP 440 probably normalised it"
            exit 1
          }

      - name: Check the distributions
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI trusts this repository, workflow and environment
    # over OIDC, so there is no API token in the repository secrets to leak or
    # rotate. The environment also gives a place to require an approval.
    environment:
      name: pypi
      url: https://pypi.org/p/lcs_parcels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      # The notes are `CHANGELOG.md`'s section for this version, so the GitHub
      # release and the file cannot drift.
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "$" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          }
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file release-notes.md
