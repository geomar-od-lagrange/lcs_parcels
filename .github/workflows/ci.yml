name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          locked: true

      - name: Lint and check formatting
        run: pixi run lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux gates; macOS (osx-arm64) and Windows (win-64) are allowed-to-fail bonuses.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          locked: true

      # `-m "not needs_creds"`, so this covers the unit suite plus the one
      # example that needs neither Parcels nor data.
      - name: Run tests
        run: pixi run test

  examples:
    name: examples (CMEMS)
    runs-on: ubuntu-latest
    # Forks get no secrets on `pull_request`, so the credentialled examples
    # cannot run there. Gate the whole job rather than teaching the tests to
    # cope: they assume their prerequisites are present and fail loudly.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          locked: true
          environments: examples

      # The subset is ~52 MB and the request lives in `get_data.py`, so key the
      # cache on that file: it is restored verbatim until the request changes.
      - name: Restore the CMEMS subset
        uses: actions/cache@v4
        with:
          path: examples/data
          key: cmems-subset-${{ hashFiles('examples/get_data.py') }}

      # Takes ~15 min, nearly all of it cabo_verde_lcs_evolution. Unbuffered
      # output is what makes it stream, so each example reports as it finishes
      # rather than the step looking hung for a quarter of an hour.
      - name: Run every example as a test (~15 min)
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: pixi run -e examples test-examples --durations=0
