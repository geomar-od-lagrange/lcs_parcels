name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          locked: true

      - name: Lint and check formatting
        run: pixi run lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux gates; macOS (osx-arm64) and Windows (win-64) are allowed-to-fail bonuses.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          locked: true

      # `pixi run test` covers tests/test_examples.py, which executes the
      # Parcels-free example here and skips the ones needing CMEMS data.
      - name: Run tests
        run: pixi run test

  examples:
    name: examples (CMEMS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Forks get no secrets on `pull_request`, so the CMEMS examples cannot run
      # there. Report that in the summary and stop, rather than failing red.
      - name: Check for CMEMS credentials
        id: creds
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
        run: |
          if [ -n "$COPERNICUSMARINE_SERVICE_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### CMEMS examples skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`COPERNICUSMARINE_SERVICE_USERNAME\` secret is visible to this run (forked pull requests get none), so the three Cabo Verde notebooks were not executed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: prefix-dev/setup-pixi@v0.10.0
        if: steps.creds.outputs.available == 'true'
        with:
          locked: true
          environments: examples

      # The subset is ~52 MB and the request lives in `get_data.py`, so key the
      # cache on that file: it is restored verbatim until the request changes.
      - name: Restore the CMEMS subset
        id: data
        if: steps.creds.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: examples/data
          key: cmems-subset-${{ hashFiles('examples/get_data.py') }}

      # One pytest run covers all of it: the `currents` fixture downloads the
      # subset on a cache miss and the three Cabo Verde examples follow. Each is
      # a separate test, so a failure names the notebook that broke.
      #
      # LCS_REQUIRE_EXAMPLES turns a skip into a failure. This job only reaches
      # here with credentials in hand, so a skipped example means the gate did
      # nothing -- which must be red, not green.
      - name: Run every example as a test
        if: steps.creds.outputs.available == 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          LCS_REQUIRE_EXAMPLES: "1"
        run: pixi run -e examples test-examples -ra
